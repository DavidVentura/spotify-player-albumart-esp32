[package]
name = "album-art-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
album-art-core = { path = "../core" }

axum = "0.8"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
